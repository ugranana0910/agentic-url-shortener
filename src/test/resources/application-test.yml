spring:
  datasource:
    url: jdbc:h2:mem:agentic_url_shortener_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

agentic:
  workspace:
    root: ${java.io.tmpdir}/agentic-url-shortener-tests

  repository:
    allowed-root: ${java.io.tmpdir}
    max-files: 2000
    max-file-size-bytes: 1048576

  execution:
    max-attempts: 2
    command-timeout-seconds: 10

  model:
    provider: deterministic

idempotency:
  retention: PT24H
  in-progress-timeout: PT2M
  max-key-length: 128