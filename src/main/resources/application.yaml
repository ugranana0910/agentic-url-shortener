spring:
  application:
    name: agentic-url-shortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_url_shortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful


url-shortener:
  base-url: ${SHORT_URL_BASE_URL:http://localhost:8080}
  code-length: ${SHORT_CODE_LENGTH:8}
  generation-attempts: ${SHORT_CODE_GENERATION_ATTEMPTS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

agentic:
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./agent-workspaces}

    repository:
      allowed-root: ${AGENT_REPOSITORY_ROOT:.}
      max-files: ${AGENT_REPOSITORY_MAX_FILES:2000}
      max-file-size-bytes: ${AGENT_REPOSITORY_MAX_FILE_SIZE_BYTES:1048576}

    execution:
      max-attempts: ${AGENT_MAX_ATTEMPTS:2}
      command-timeout-seconds: ${AGENT_COMMAND_TIMEOUT_SECONDS:120}

    model:
      provider: ${MODEL_PROVIDER:deterministic}

idempotency:
  retention: ${IDEMPOTENCY_RETENTION:PT24H}
  in-progress-timeout: ${IDEMPOTENCY_IN_PROGRESS_TIMEOUT:PT2M}
  max-key-length: ${IDEMPOTENCY_MAX_KEY_LENGTH:128}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"