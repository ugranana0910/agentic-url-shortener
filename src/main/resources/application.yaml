spring:
  application:
    name: agentic-url-shortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_url_shortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

agentic:
  workspace:
    root: ${AGENT_WORKSPACE_ROOT:./agent-workspaces}

  execution:
    max-attempts: ${AGENT_MAX_ATTEMPTS:2}
    command-timeout-seconds: ${AGENT_COMMAND_TIMEOUT_SECONDS:120}

  model:
    provider: ${MODEL_PROVIDER:deterministic}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"