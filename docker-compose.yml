services:
  postgres:
    image: postgres:17-alpine
    container_name: agentic-url-shortener-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentic_url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - agentic_url_shortener_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d agentic_url_shortener
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - agentic_url_shortener_network

  application:
    build:
      context: .
      dockerfile: Dockerfile

    image: agentic-url-shortener:local
    container_name: agentic-url-shortener-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agentic_url_shortener
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SERVER_PORT: 8080
      SHORT_URL_BASE_URL: http://localhost:8080

      AGENT_WORKSPACE_ROOT: /workspace/agent-workspaces
      AGENT_REPOSITORY_ROOT: /workspace/repository
      AGENT_REPOSITORY_MAX_FILES: 2000
      AGENT_REPOSITORY_MAX_FILE_SIZE_BYTES: 1048576

      AGENT_MAX_ATTEMPTS: 2
      AGENT_COMMAND_TIMEOUT_SECONDS: 120
      AGENT_MAX_OUTPUT_CHARACTERS: 100000

      MODEL_PROVIDER: deterministic

    ports:
      - "8080:8080"

    volumes:
      - agentic_url_shortener_workspaces:/workspace/agent-workspaces

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/actuator/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - agentic_url_shortener_network

volumes:
  agentic_url_shortener_postgres_data:
  agentic_url_shortener_workspaces:

networks:
  agentic_url_shortener_network:
    driver: bridge