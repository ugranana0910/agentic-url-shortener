services:
  postgres:
    image: postgres:17-alpine
    container_name: agentic-url-shortener-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agentic_url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - agentic_url_shortener_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d agentic_url_shortener
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  agentic_url_shortener_postgres_data: